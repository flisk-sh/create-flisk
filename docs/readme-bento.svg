<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 650" fill="none">
  <defs>
    <radialGradient id="cyanGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1020 90) rotate(116) scale(480 350)">
      <stop stop-color="#14b8a6" stop-opacity=".38"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(240 150) rotate(44) scale(480 360)">
      <stop stop-color="#2563eb" stop-opacity=".44"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="96" y1="128" x2="1244" y2="594" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity=".105"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".035"/>
    </linearGradient>
    <linearGradient id="accent" x1="130" y1="572" x2="1270" y2="572" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60a5fa"/>
      <stop offset=".52" stop-color="#a7f3d0"/>
      <stop offset="1" stop-color="#f9a8d4"/>
    </linearGradient>
    <filter id="shadow" x="54" y="76" width="1292" height="532" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="30" stdDeviation="28" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect width="1400" height="650" rx="24" fill="#0c0b0a"/>
  <rect width="1400" height="650" rx="24" fill="url(#blueGlow)"/>
  <rect width="1400" height="650" rx="24" fill="url(#cyanGlow)"/>

  <text x="92" y="86" fill="#ffffff" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="44" font-weight="800">A starter surface with serious defaults.</text>
  <text x="94" y="123" fill="#f7f4ee" fill-opacity=".67" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="19">Describe the landscape, generate the topology, then boot only what matters.</text>

  <g filter="url(#shadow)">
    <rect x="92" y="168" width="508" height="238" rx="18" fill="url(#card)" stroke="#ffffff" stroke-opacity=".12"/>
    <text x="130" y="223" fill="#ffffff" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="31" font-weight="800">Describe the landscape</text>
    <text x="130" y="266" fill="#f7f4ee" fill-opacity=".72" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="18">Choose services, runtimes, databases, queues,</text>
    <text x="130" y="293" fill="#f7f4ee" fill-opacity=".72" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="18">secrets, tests, and docs from one CLI flow.</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
      <rect x="130" y="326" width="120" height="42" rx="21" fill="#93c5fd" fill-opacity=".18"/>
      <text x="190" y="352" text-anchor="middle" fill="#bfdbfe">runtime</text>
      <rect x="264" y="326" width="118" height="42" rx="21" fill="#a7f3d0" fill-opacity=".16"/>
      <text x="323" y="352" text-anchor="middle" fill="#bbf7d0">infra</text>
      <rect x="396" y="326" width="136" height="42" rx="21" fill="#f9a8d4" fill-opacity=".15"/>
      <text x="464" y="352" text-anchor="middle" fill="#fbcfe8">safety</text>
    </g>

    <rect x="624" y="168" width="300" height="238" rx="18" fill="url(#card)" stroke="#ffffff" stroke-opacity=".12"/>
    <text x="662" y="223" fill="#ffffff" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="800">Generate files</text>
    <text x="662" y="265" fill="#f7f4ee" fill-opacity=".7" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="17">Manifests, routes, Dockerfiles, Prisma schema, env contracts, diagrams, and agent docs.</text>
    <text x="662" y="341" fill="#d9f99d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">68 files written</text>

    <rect x="948" y="168" width="360" height="238" rx="18" fill="url(#card)" stroke="#ffffff" stroke-opacity=".12"/>
    <text x="986" y="223" fill="#ffffff" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="800">Boot locally</text>
    <text x="986" y="265" fill="#f7f4ee" fill-opacity=".7" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="17">Tilt starts selected services. Traefik routes them. Hot reload stays armed.</text>
    <rect x="986" y="314" width="228" height="48" rx="12" fill="#05070a" stroke="#ffffff" stroke-opacity=".14"/>
    <text x="1010" y="345" fill="#a7f3d0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">flisk up web api</text>

    <rect x="92" y="430" width="382" height="118" rx="18" fill="url(#card)" stroke="#ffffff" stroke-opacity=".12"/>
    <text x="130" y="486" fill="#ffffff" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="800">Own every file</text>
    <text x="130" y="520" fill="#f7f4ee" fill-opacity=".68" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="16">No mystery platform. Inspect, edit, commit.</text>

    <rect x="498" y="430" width="810" height="118" rx="18" fill="url(#card)" stroke="#ffffff" stroke-opacity=".12"/>
    <text x="536" y="486" fill="#ffffff" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="800">Bun - Node.js - TypeScript - Docker - Traefik - Tilt</text>
    <text x="536" y="522" fill="#f7f4ee" fill-opacity=".72" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="20">Prisma - Postgres - NATS - Infisical - Playwright - AGENTS.md</text>
    <path d="M130 572H1270" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
