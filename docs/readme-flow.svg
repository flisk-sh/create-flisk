<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 360" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0c0b0a"/>
      <stop offset=".55" stop-color="#111827"/>
      <stop offset="1" stop-color="#0c0b0a"/>
    </linearGradient>
    <linearGradient id="rail" x1="172" y1="190" x2="1228" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60a5fa"/>
      <stop offset=".5" stop-color="#a7f3d0"/>
      <stop offset="1" stop-color="#f9a8d4"/>
    </linearGradient>
    <filter id="shadow" x="58" y="80" width="1284" height="238" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="26" stdDeviation="26" flood-color="#000" flood-opacity=".36"/>
    </filter>
  </defs>

  <rect width="1400" height="360" rx="22" fill="url(#bg)"/>
  <text x="96" y="75" fill="#ffffff" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="38" font-weight="800">From blank folder to live topology.</text>
  <text x="98" y="110" fill="#f7f4ee" fill-opacity=".66" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="18">Forge Flisk turns a small prompt sequence into local infrastructure your team can inspect.</text>

  <path d="M178 190H1222" stroke="url(#rail)" stroke-width="3" stroke-linecap="round"/>
  <g filter="url(#shadow)">
    <g transform="translate(92 142)">
      <rect width="262" height="134" rx="18" fill="#ffffff" fill-opacity=".075" stroke="#ffffff" stroke-opacity=".14"/>
      <circle cx="58" cy="67" r="28" fill="#93c5fd" fill-opacity=".18" stroke="#93c5fd"/>
      <text x="58" y="76" text-anchor="middle" fill="#bfdbfe" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="800">1</text>
      <text x="104" y="54" fill="#ffffff" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="23" font-weight="800">Answer prompts</text>
      <text x="104" y="84" fill="#f7f4ee" fill-opacity=".66" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="15">Runtime, infra, data, queues, tests.</text>
    </g>

    <g transform="translate(407 142)">
      <rect width="262" height="134" rx="18" fill="#ffffff" fill-opacity=".075" stroke="#ffffff" stroke-opacity=".14"/>
      <circle cx="58" cy="67" r="28" fill="#a7f3d0" fill-opacity=".16" stroke="#a7f3d0"/>
      <text x="58" y="76" text-anchor="middle" fill="#bbf7d0" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="800">2</text>
      <text x="104" y="54" fill="#ffffff" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="23" font-weight="800">Generate files</text>
      <text x="104" y="84" fill="#f7f4ee" fill-opacity=".66" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="15">Manifests, routes, Docker, docs.</text>
    </g>

    <g transform="translate(722 142)">
      <rect width="262" height="134" rx="18" fill="#ffffff" fill-opacity=".075" stroke="#ffffff" stroke-opacity=".14"/>
      <circle cx="58" cy="67" r="28" fill="#f9a8d4" fill-opacity=".16" stroke="#f9a8d4"/>
      <text x="58" y="76" text-anchor="middle" fill="#fbcfe8" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="800">3</text>
      <text x="104" y="54" fill="#ffffff" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="23" font-weight="800">Boot locally</text>
      <text x="104" y="84" fill="#f7f4ee" fill-opacity=".66" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="15">Tilt, Traefik, health checks.</text>
    </g>

    <g transform="translate(1037 142)">
      <rect width="271" height="134" rx="18" fill="#f7f4ee"/>
      <circle cx="58" cy="67" r="28" fill="#0c0b0a"/>
      <text x="58" y="76" text-anchor="middle" fill="#d9f99d" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="800">4</text>
      <text x="104" y="54" fill="#10100e" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="23" font-weight="800">Own the stack</text>
      <text x="104" y="84" fill="#10100e" fill-opacity=".66" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="15">Inspect, test, edit, commit.</text>
    </g>
  </g>
</svg>
