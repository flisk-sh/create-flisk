name: GEL
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1" # weekly, so the dashboard record never expires (artifacts last 30 days)
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gel-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gel:
    permissions: { contents: read, checks: read, pull-requests: read }
    uses: flisk-sh/gel/.github/workflows/gel.yml@7f8dd7d40589383d3a0b64890df9d82f25a7a97a
    with: { gel_ref: 7f8dd7d40589383d3a0b64890df9d82f25a7a97a }
