name: Publish package registries

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write
  id-token: write # npm trusted publishing

concurrency:
  group: package-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Trusted publishing needs an npm CLI that speaks OIDC; the bundled npm is too old.
      - name: Update npm for trusted publishing
        run: npm install --global npm@12.2.0

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Check release version and package contents
        id: package
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "::error::Release tag version '$tag_version' does not match package version '$package_version'."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/create-flisk-package"
          npm pack --json --pack-destination "$RUNNER_TEMP/create-flisk-package" > "$RUNNER_TEMP/create-flisk-pack.json"
          tarball="$RUNNER_TEMP/create-flisk-package/$(node -p "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/create-flisk-pack.json', 'utf8'))[0].filename")"
          if [[ ! -f "$tarball" ]]; then
            echo "::error::npm pack did not produce the expected package archive."
            exit 1
          fi

          node --input-type=module - "$RUNNER_TEMP/create-flisk-pack.json" <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))[0];
          const files = new Set(report.files.map(({ path }) => path));
          if (report.name !== 'create-flisk') {
            throw new Error(`Expected package name create-flisk, got ${report.name}`);
          }
          if (report.filename !== `create-flisk-${report.version}.tgz`) {
            throw new Error(`Unexpected package archive name: ${report.filename}`);
          }
          for (const required of ['package.json', 'README.md', 'LICENSE', 'index.html', 'dist/index.html', 'src/main.jsx']) {
            if (!files.has(required)) throw new Error(`Package is missing required file: ${required}`);
          }
          for (const file of files) {
            if (file.startsWith('node_modules/') || file.includes('/node_modules/') || file.startsWith('.git/')) {
              throw new Error(`Package contains excluded content: ${file}`);
            }
          }
          console.log(`Validated ${report.filename} (${report.size} bytes)`);
          NODE

          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "version=$package_version" >> "$GITHUB_OUTPUT"

      # The npm name is unscoped, so it cannot live on GitHub Packages, which serves scoped packages only.
      # The GitHub Packages copy is published under the organization scope instead.
      - name: Build the GitHub Packages archive
        id: github-package
        env:
          PACKAGE_TARBALL: ${{ steps.package.outputs.tarball }}
        shell: bash
        run: |
          set -euo pipefail
          alias_dir="$RUNNER_TEMP/github-package"
          mkdir -p "$alias_dir"
          tar -xzf "$PACKAGE_TARBALL" -C "$alias_dir"
          node --input-type=module - "$alias_dir/package/package.json" <<'NODE'
          import fs from 'node:fs';
          const manifestPath = process.argv[2];
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          manifest.name = '@flisk-sh/create-flisk';
          fs.writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE
          alias_tarball="$(cd "$alias_dir/package" && npm pack --pack-destination "$alias_dir" --silent)"
          if [[ ! -f "$alias_dir/$alias_tarball" ]]; then
            echo "::error::npm pack did not produce the GitHub Packages archive."
            exit 1
          fi
          echo "tarball=$alias_dir/$alias_tarball" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        env:
          PACKAGE_TARBALL: ${{ steps.package.outputs.tarball }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if npm view "create-flisk@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "create-flisk@$PACKAGE_VERSION is already published, skipping."
            exit 0
          fi
          npm publish "$PACKAGE_TARBALL" --access public --provenance || {
            echo "::error::npm publication failed for version $PACKAGE_VERSION. See the retained workflow artifact for recovery."
            exit 1
          }

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_TARBALL: ${{ steps.github-package.outputs.tarball }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          npmrc="$RUNNER_TEMP/github-packages.npmrc"
          printf '@flisk-sh:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > "$npmrc"
          NPM_CONFIG_USERCONFIG="$npmrc" npm publish "$PACKAGE_TARBALL" --registry=https://npm.pkg.github.com/ || {
            echo "::error::GitHub Packages publication failed for version $PACKAGE_VERSION after npm publication. See the retained workflow artifact for recovery."
            exit 1
          }

      - name: Retain package archive for release recovery
        if: always() && steps.package.outputs.tarball != ''
        uses: actions/upload-artifact@v4
        with:
          name: create-flisk-package-${{ steps.package.outputs.version }}
          path: ${{ steps.package.outputs.tarball }}
          if-no-files-found: error
          retention-days: 30
