name: Publish package registries

on:
  release:
    types: [published]

# The package is published under two names: the unscoped "create-flisk" and the scoped
# "@flisk-sh/create-flisk". A package has exactly one name in its package.json, so the scoped
# publication is the same archive with the name rewritten in the packed manifest. GitHub Packages
# serves scoped names only, so the unscoped name goes to npmjs.org alone.
#
# Owner setup required before the first publish succeeds: npmjs.com -> Packages -> create-flisk
# -> Settings -> Trusted Publisher -> GitHub Actions -> organization "flisk-sh", repository
# "create-flisk", workflow filename "publish-package.yml", allowed action "npm publish". The same
# configuration is needed for "@flisk-sh/create-flisk" once that package exists. A package's first
# version cannot be published through OIDC, so version 0.1.1 (or later) has to be published once
# with an npm token before the trusted publisher can take over.
permissions:
  contents: read
  packages: write
  id-token: write # npm trusted publishing

concurrency:
  group: package-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Trusted publishing needs an npm CLI that speaks OIDC; the bundled npm is too old.
      - name: Update npm for trusted publishing
        run: npm install --global npm@12.2.0

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Check release version and package contents
        id: package
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "::error::Release tag version '$tag_version' does not match package version '$package_version'."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/create-flisk-package"
          # Suppress npm warnings that pollute JSON output; use --loglevel=error
          npm pack --json --loglevel=error --pack-destination "$RUNNER_TEMP/create-flisk-package" > "$RUNNER_TEMP/create-flisk-pack.json"
          # npm pack --json returns an object keyed by package name; extract the first value
          tarball="$RUNNER_TEMP/create-flisk-package/$(node -p "
            const data = JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/create-flisk-pack.json', 'utf8'));
            const report = Array.isArray(data) ? data[0] : Object.values(data)[0];
            report.filename
          ")"
          if [[ ! -f "$tarball" ]]; then
            echo "::error::npm pack did not produce the expected package archive."
            exit 1
          fi

          node --input-type=module - "$RUNNER_TEMP/create-flisk-pack.json" <<'NODE'
          import fs from 'node:fs';
          const data = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const report = Array.isArray(data) ? data[0] : Object.values(data)[0];
          const files = new Set(report.files.map(({ path }) => path));
          if (report.name !== 'create-flisk') {
            throw new Error(`Expected package name create-flisk, got ${report.name}`);
          }
          if (report.filename !== `create-flisk-${report.version}.tgz`) {
            throw new Error(`Unexpected package archive name: ${report.filename}`);
          }
          for (const required of ['package.json', 'README.md', 'LICENSE', 'index.html', 'dist/index.html', 'src/main.jsx']) {
            if (!files.has(required)) throw new Error(`Package is missing required file: ${required}`);
          }
          for (const file of files) {
            if (file.startsWith('node_modules/') || file.includes('/node_modules/') || file.startsWith('.git/')) {
              throw new Error(`Package contains excluded content: ${file}`);
            }
          }
          console.log(`Validated ${report.filename} (${report.size} bytes)`);
          NODE

          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "version=$package_version" >> "$GITHUB_OUTPUT"

      # The scoped copy of the archive. GitHub Packages serves scoped names only, so the unscoped
      # name goes to npmjs.org alone.
      - name: Build the scoped archive
        id: scoped-package
        env:
          PACKAGE_TARBALL: ${{ steps.package.outputs.tarball }}
        shell: bash
        run: |
          set -euo pipefail
          alias_dir="$RUNNER_TEMP/scoped-package"
          mkdir -p "$alias_dir"
          tar -xzf "$PACKAGE_TARBALL" -C "$alias_dir"
          node --input-type=module - "$alias_dir/package/package.json" <<'NODE'
          import fs from 'node:fs';
          const manifestPath = process.argv[2];
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          if (manifest.name !== 'create-flisk') {
            throw new Error(`Unexpected package name: ${manifest.name}`);
          }
          // Only the name changes: the version and the contents stay the ones the unscoped package
          // was published with.
          manifest.name = '@flisk-sh/create-flisk';
          fs.writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE
          alias_tarball="$(cd "$alias_dir/package" && npm pack --pack-destination "$alias_dir" --silent)"
          if [[ ! -f "$alias_dir/$alias_tarball" ]]; then
            echo "::error::npm pack did not produce the scoped archive."
            exit 1
          fi
          echo "tarball=$alias_dir/$alias_tarball" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        env:
          PACKAGE_TARBALL: ${{ steps.package.outputs.tarball }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          # A token is only needed for a package's first version: npm cannot publish a
          # package that does not exist yet through OIDC. Once the trusted publisher is
          # configured, this secret is not needed any more.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "Publishing with the NPM_TOKEN secret."
            export NODE_AUTH_TOKEN="$NPM_TOKEN"
          else
            echo "No NPM_TOKEN secret: publishing with npm trusted publishing (OIDC)."
          fi
          if npm view "create-flisk@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "create-flisk@$PACKAGE_VERSION is already published, skipping."
            exit 0
          fi
          npm publish "$PACKAGE_TARBALL" --access public --provenance || {
            echo "::error::npm publication failed for version $PACKAGE_VERSION. See the retained workflow artifact for recovery."
            exit 1
          }

      - name: Publish the scoped package to npm
        env:
          PACKAGE_TARBALL: ${{ steps.scoped-package.outputs.tarball }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          # A token is only needed for a package's first version: npm cannot publish a
          # package that does not exist yet through OIDC. Once the trusted publisher is
          # configured, this secret is not needed any more.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "Publishing with the NPM_TOKEN secret."
            export NODE_AUTH_TOKEN="$NPM_TOKEN"
          else
            echo "No NPM_TOKEN secret: publishing with npm trusted publishing (OIDC)."
          fi
          if npm view "@flisk-sh/create-flisk@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "@flisk-sh/create-flisk@$PACKAGE_VERSION is already published, skipping."
            exit 0
          fi
          npm publish "$PACKAGE_TARBALL" --access public --provenance || {
            echo "::error::npm publication failed for @flisk-sh/create-flisk version $PACKAGE_VERSION. See the retained workflow artifact for recovery."
            exit 1
          }

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_TARBALL: ${{ steps.scoped-package.outputs.tarball }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          npmrc="$RUNNER_TEMP/github-packages.npmrc"
          printf '@flisk-sh:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > "$npmrc"
          NPM_CONFIG_USERCONFIG="$npmrc" npm publish "$PACKAGE_TARBALL" --registry=https://npm.pkg.github.com/ || {
            echo "::error::GitHub Packages publication failed for version $PACKAGE_VERSION after npm publication. See the retained workflow artifact for recovery."
            exit 1
          }

      - name: Retain package archive for release recovery
        if: always() && steps.package.outputs.tarball != ''
        uses: actions/upload-artifact@v4
        with:
          name: create-flisk-package-${{ steps.package.outputs.version }}
          path: ${{ steps.package.outputs.tarball }}
          if-no-files-found: error
          retention-days: 30
