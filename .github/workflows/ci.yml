name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spellcheck:
    name: Spell check
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: crate-ci/typos@v1

  build:
    name: Build and validate package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  names:
    name: Renamed package names
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Fail on superseded organization and package names
        shell: bash
        run: |
          set -euo pipefail
          # The patterns use character classes so this workflow does not match itself.
          if git grep -n -E "flisk[-]landscape|create[-]flisk[-]stack|flisk[-]cli[-]core" -- .; then
            echo "::error::Superseded organization or package names are still referenced."
            exit 1
          fi
          echo "No superseded names found."
